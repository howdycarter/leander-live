<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/logo-mark.png" />
    <link rel="apple-touch-icon" href="/brand/logo-mark.png" />
    <meta name="theme-color" content="#FBF6EC" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Leander Live — What's happening in Leander, TX</title>
    <meta
      name="description"
      content="A real-time community events board for Leander, Texas. Browse local events or submit your own."
    />
    <link rel="canonical" href="https://leanderlive.com/" />
    <script>
      // Canonical host enforcement: the Convex deployment URL must never be
      // discoverable or shareable. Browsers landing on *.convex.site are
      // moved to leanderlive.com, preserving path/query/hash.
      // Server routes (/api/*) are excluded so OAuth callbacks and webhooks
      // keep working on the deployment host.
      (function () {
        try {
          if (
            /\.convex\.site$/.test(location.hostname) &&
            location.pathname.indexOf("/api/") !== 0
          ) {
            location.replace(
              "https://leanderlive.com" +
                location.pathname +
                location.search +
                location.hash
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
